<!doctype html>
<html><head><meta charset="utf-8"><title>plate textures</title><style>html,body{margin:0;background:#fff}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="../lib/v3.js"></script>
<script src="../lib/statement.js"></script>
<script>
// Face textures for the Blender plate shots L19/L20 (2488x1606, multiplied into brushed aluminium): engraving on a light field.
// ?tex=blank | statement | values-hidden | all-hidden | stranger-1..3
const tex = new URLSearchParams(location.search).get('tex') || 'statement', all = [true, true, true, true, true];
V3.stage({ w: 2488, h: 1606, total: 1, draw: (ctx) => { ctx.fillStyle = '#F4F5F8'; ctx.fillRect(0, 0, 2488, 1606);
  if (tex === 'blank') return;
  if (tex.startsWith('stranger')) { const n = +tex.split('-')[1]; return Statement.engraveStatement(ctx, { reveal: (i) => (i < 0 ? 0 : i < 3 + (n % 3) ? 1 : 0) }); }
  Statement.engraveStatement(ctx, tex === 'values-hidden' ? { redact: all } : tex === 'all-hidden' ? { redact: all, names: all } : {}); } });
</script></body></html>
